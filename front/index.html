<!doctype html>
<html lang="fr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b2be0" />
    <!-- Open Graph : aperçu affiché quand un lien est partagé (réseaux sociaux, messageries).
         Le <title>, la description et og:title de chaque page sont ajoutés par le composant
         PageMetadata (React 19 les place ici, dans le <head>) : on ne les écrit pas ici pour
         éviter les doublons. -->
    <meta property="og:site_name" content="Bazardim" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <link rel="icon" type="image/x-icon" href="/icons/bazardim_logo.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
