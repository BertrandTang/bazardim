# Base de données PostgreSQL pour le développement et les tests (+ l'API en conteneur, en option).
#
#   docker compose up -d     -> démarre la base en arrière-plan
#   docker compose down      -> l'arrête (les données sont conservées dans le volume)
#   docker compose down -v   -> l'arrête ET supprime les données
#
#   docker compose --profile api up -d --build
#                            -> démarre AUSSI l'API dans un conteneur (image construite avec back/Dockerfile).
#                               ⚠️ Arrêter d'abord `npm run dev` dans back/ : les deux utilisent le port 3000.
#
# Le mot de passe n'est PAS écrit ici : Docker Compose le lit dans le fichier .env
# placé à côté de ce fichier (ignoré par Git). Voir .env.example.
services:
  database:
    image: postgres:17-alpine
    container_name: bazardim_database
    environment:
      POSTGRES_USER: bazardim
      # ":?" arrête Docker Compose avec ce message si la variable n'est pas définie.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env (voir .env.example)}
      POSTGRES_DB: bazardim
    ports:
      # 127.0.0.1 : la base n'est joignable que depuis cet ordinateur,
      # pas depuis les autres appareils du même réseau (Wi-Fi partagé...).
      - '127.0.0.1:5432:5432'
    volumes:
      # Les données survivent à l'arrêt du conteneur grâce à ce volume.
      - database_data:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création de la base (ici : base de test).
      - ./back/database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazardim']
      interval: 5s
      timeout: 3s
      retries: 10

  # API Bazardim dans un conteneur, comme en production.
  # "profiles" : ce service ne démarre QUE si on le demande (--profile api). Un simple
  # `docker compose up -d` lance seulement la base, pour développer avec `npm run dev`.
  api:
    build: ./back
    container_name: bazardim_api
    profiles: ['api']
    # On attend que la base soit prête (healthcheck ci-dessus) avant de démarrer l'API.
    depends_on:
      database:
        condition: service_healthy
    # Secrets et réglages (JWT_SECRET, clés Stripe, FRONT_URL...) lus dans back/.env.
    env_file: ./back/.env
    environment:
      NODE_ENV: production
      # Dans le réseau Docker, la base s'appelle "database" (nom du service), pas "localhost".
      DATABASE_URL: postgres://bazardim:${POSTGRES_PASSWORD}@database:5432/bazardim
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Les images envoyées par les utilisateurs survivent à la reconstruction du conteneur.
      - uploads_data:/app/uploads

volumes:
  database_data:
  uploads_data:
