# Intégration continue : à chaque push ou pull request, GitHub vérifie que le code
# passe l'analyse statique, les tests et le build. Un échec est visible sur la pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  front:
    name: Front-end (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  back:
    name: Back-end (lint + tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    # Base PostgreSQL jetable, créée pour ce job puis détruite : elle n'est joignable
    # que par le job lui-même. On peut donc s'y connecter sans mot de passe ("trust"),
    # ce qui évite d'écrire un mot de passe dans ce fichier.
    services:
      database:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bazardim
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bazardim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bazardim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgres://bazardim@localhost:5432/bazardim_test
